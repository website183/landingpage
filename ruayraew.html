
<div class="rr-landing">
  <style>
    .rr-landing {
      --green: #123d26;
      --gold: #d8b75c;
      --cream: #fff9e9;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 40px;
      color: #202820;
      font-family: inherit;
      box-sizing: border-box;
    }

    .rr-landing *,
    .rr-landing *::before,
    .rr-landing *::after {
      box-sizing: border-box;
    }

    .rr-hero {
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid #e4d6a6;
      background: var(--green);
      box-shadow: 0 8px 24px rgba(15, 48, 28, .12);
    }

    .rr-hero img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
    }

    .rr-intro {
      text-align: center;
      padding: 28px 12px 20px;
    }

    .rr-intro h1 {
      margin: 0 0 8px;
      color: var(--green);
      font-size: clamp(23px, 4vw, 30px);
      font-weight: 800;
      line-height: 1.4;
    }

    .rr-intro p {
      margin: 0;
      color: #6d746d;
      font-size: 15px;
      line-height: 1.8;
    }

    .rr-menu {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      max-width: 560px;
      margin: 8px auto 0;
    }

    .rr-menu-card {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 84px;
      padding: 15px 18px;
      border: 1px solid #e6dfca;
      border-radius: 15px;
      background: #fff;
      color: #25352a !important;
      text-decoration: none !important;
      box-shadow: 0 3px 12px rgba(20, 45, 28, .045);
      transition: transform .2s ease, border-color .2s ease,
                  box-shadow .2s ease;
    }

    .rr-menu-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold);
      box-shadow: 0 8px 22px rgba(20, 55, 32, .11);
    }

    .rr-menu-logo {
      display: flex;
      flex: 0 0 52px;
      width: 52px;
      height: 52px;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 50%;
      background: #f5f0df;
      border: 1px solid #e7d49a;
    }

    .rr-menu-logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      margin: 0;
    }

    .rr-menu-emoji {
      font-size: 29px;
      line-height: 1;
    }

    .rr-menu-text {
      flex: 1;
      min-width: 0;
    }

    .rr-menu-title {
      display: block;
      margin-bottom: 4px;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.5;
    }

    .rr-menu-subtitle {
      display: block;
      color: #7a8079;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.6;
    }

    .rr-menu-arrow {
      color: #b08c32;
      font-size: 25px;
      font-weight: 500;
      transition: transform .2s ease;
    }

    .rr-menu-card:hover .rr-menu-arrow {
      transform: translateX(4px);
    }

    .rr-footer {
      margin-top: 25px;
      text-align: center;
      color: #959991;
      font-size: 12px;
      line-height: 1.8;
    }

    @media (max-width: 480px) {
      .rr-landing {
        padding: 14px 12px 28px;
      }

      .rr-hero {
        border-radius: 13px;
      }

      .rr-intro {
        padding: 23px 6px 17px;
      }

      .rr-menu-card {
        min-height: 78px;
        padding: 13px;
        gap: 12px;
      }

      .rr-menu-logo {
        flex-basis: 46px;
        width: 46px;
        height: 46px;
      }

      .rr-menu-title {
        font-size: 15px;
      }

      .rr-menu-subtitle {
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .rr-menu-card,
      .rr-menu-arrow {
        transition: none;
      }
    }
  </style>

  <!-- HERO -->

      <span class="rr-menu-logo">

        <span class="rr-menu-title">กลุ่มใบ้หวย</span>

  </nav>

    กรุณาตรวจสอบข้อมูลและเงื่อนไขของแต่ละบริการก่อนใช้งาน
